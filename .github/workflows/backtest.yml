name: Backtest

on:
  schedule:
    - cron: "30 11 * * 6"   # every Saturday 17:00 IST
  workflow_dispatch: {}
  push:                     # re-test automatically whenever the rules change
    branches: [main]
    paths:
      - config.json
      - strategy.py
      - indicators.py
      - backtest.py
      - .github/workflows/backtest.yml

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout data branch
        id: databranch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: signals-data
          path: data-branch

      - name: Create data branch (first run only)
        if: steps.databranch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf data-branch && mkdir data-branch && cd data-branch
          git init -b signals-data
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run backtest
        run: python backtest.py --data-dir data-branch

      - name: Save results
        run: |
          cd data-branch
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "backtest $(date -u +%F)"
          git push origin HEAD:signals-data
