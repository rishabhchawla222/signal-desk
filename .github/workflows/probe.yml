name: Probe market sources

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - probe_market.py
      - .github/workflows/probe.yml

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python probe_market.py out
      - name: Save to probe-results branch
        run: |
          cd out
          git init -q -b probe-results
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add -A && git commit -qm "probe $(date -u +%FT%H%M)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-results
