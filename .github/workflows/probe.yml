name: Probe BSE

on:
  push:
    branches: [main]
    paths: [probe_bse.py, .github/workflows/probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe_bse.py out
      - name: Save
        run: |
          cd out && git init -q -b probe-results && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm probe && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-results
