name: Save raw data

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - dump_data.py
      - .github/workflows/dump-data.yml

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: signals-data
          path: data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python dump_data.py --data-dir data-branch
      - name: Save
        run: |
          cd data-branch
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "raw candles $(date -u +%F)"
          git push origin HEAD:signals-data
