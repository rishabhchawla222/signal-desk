<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Desk Trade</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Signal Desk paper trading: stocks and F&O on live NSE prices with virtual money.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23163a70'/><path d='M7 21l6-6 4 3 8-9' stroke='%2334d399' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="sr" href="#view" style="z-index:100">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#dashboard" aria-label="Signal Desk – dashboard">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#163a70"/><path d="M7 21l6-6 4 3 8-9" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="word">Signal Desk</span>
    </a>
    <span class="mode" title="Paper trading: virtual money, no real orders are placed" role="note"><span>PAPER</span><span class="long">TRADING</span></span>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search stocks, e.g. Reliance" autocomplete="off" aria-label="Search stocks and indices" aria-controls="results">
      <div id="results" class="results" role="listbox" hidden></div>
    </div>
    <span class="ago" id="ago" title="How fresh the prices are" aria-live="off"><span class="dot"></span><span class="txt" id="agoTxt">Loading</span></span>
    <button class="funds-pill" id="fundsPill" title="Available to trade (paper)"><span>Available</span><b id="availTop">—</b></button>
  </div>
  <nav class="ticker" id="ticker" aria-label="Indices"></nav>
</header>

<div class="shell">
  <nav class="side" id="sideNav" aria-label="Main"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="bottom" id="bottomNav" aria-label="Main"></nav>
<div id="sheetRoot"></div>
<div id="dialogRoot"></div>
<div id="moreRoot"></div>
<div class="toasts" id="toasts"></div>

<noscript><div class="card pad" style="margin:20px">Signal Desk needs JavaScript to load live prices.</div></noscript>
<script src="engine.js"></script>
<script src="control.js"></script>
<script src="app.js"></script>
</body>
</html>
