<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Desk Trade</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f6f8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23163a70'/><path d='M7 21l6-6 4 3 8-9' stroke='%2334d399' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar + index ticker, sidebar nav on desktop / bottom nav on phones, sheet for orders */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#f0f2f5; --ink:#141a24; --muted:#667085; --faint:#98a2b3;
  --line:#e4e7ec; --accent:#1f4fd6; --accent-ink:#ffffff; --accent-soft:#e8eefc;
  --up:#0b9a5f; --up-soft:#e6f6ee; --down:#d9363e; --down-soft:#fdecec; --warn:#b26b00; --warn-soft:#fff4e0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1016; --surface:#141a22; --surface2:#1b222c; --ink:#e7ebf1; --muted:#97a1b1; --faint:#677285;
  --line:#252d39; --accent:#7aa2ff; --accent-ink:#0c1016; --accent-soft:#1b2640;
  --up:#33d391; --up-soft:rgba(51,211,145,.12); --down:#ff6b72; --down-soft:rgba(255,107,114,.12); --warn:#f2b44c; --warn-soft:rgba(242,180,76,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1016; --surface:#141a22; --surface2:#1b222c; --ink:#e7ebf1; --muted:#97a1b1; --faint:#677285;
  --line:#252d39; --accent:#7aa2ff; --accent-ink:#0c1016; --accent-soft:#1b2640;
  --up:#33d391; --up-soft:rgba(51,211,145,.12); --down:#ff6b72; --down-soft:rgba(255,107,114,.12); --warn:#f2b44c; --warn-soft:rgba(242,180,76,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .faint{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16.5px;letter-spacing:-.2px;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.paper{font:600 10px var(--mono);letter-spacing:1px;color:var(--warn);background:var(--warn-soft);padding:3px 7px;border-radius:6px}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 12px 9px 34px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:40}
.results button{display:flex;width:100%;justify-content:space-between;gap:12px;padding:10px 12px;background:none;border:0;text-align:left}
.results button:hover,.results button.sel{background:var(--surface2)}
.funds-pill{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;background:none;border:0;padding:2px 4px}
.funds-pill span{font-size:11px;color:var(--muted)} .funds-pill b{font:600 14px var(--mono)}
.ticker{display:flex;gap:8px;overflow-x:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:1320px;margin:0 auto;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tick{flex:none;display:flex;gap:8px;align-items:baseline;background:var(--surface2);border:0;border-radius:9px;padding:6px 10px;white-space:nowrap}
.tick b{font-weight:700;font-size:12.5px} .tick .num{font-size:12.5px}

/* shell */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.side{position:sticky;top:120px;align-self:start;display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:none;border:0;font-weight:600;color:var(--muted);text-align:left}
.nav-btn svg{width:18px;height:18px}
.nav-btn:hover{background:var(--surface2);color:var(--ink)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent)}
.data-note{margin-top:14px;padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line)}
.bottom{display:none}
main{min-width:0}
h1{font-size:22px;letter-spacing:-.3px;margin:0 0 4px;text-wrap:balance}
h2{font-size:15.5px;margin:26px 0 12px;letter-spacing:-.1px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--mono);letter-spacing:.4px;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.up{background:var(--up-soft);color:var(--up)} .pill.down{background:var(--down-soft);color:var(--down)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.live .dot{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none}}

.grid{display:grid;gap:12px}
.g-idx{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g-tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:var(--faint)}
.tile .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .px{font:600 16px var(--mono)}
.tile .ch{font:500 12.5px var(--mono)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* tables & lists */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13.5px}
th{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;background:var(--surface)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface2)}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.list-item:last-child{border-bottom:0}
.list-item:hover{background:var(--surface2)}
.li-main{flex:1;min-width:0}
.li-main b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-main > span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.li-end{text-align:right}
.li-end b{display:block;font:600 14px var(--mono)}
.li-end span{font:500 12.5px var(--mono)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* buttons */
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--surface2);color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.buy{background:var(--up);color:#fff} .btn.sell{background:var(--down);color:#fff}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:inline-grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{color:var(--warn);border-color:var(--warn)}

/* stock page */
.quote-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.big{font:600 30px var(--mono);letter-spacing:-.6px}
.chart{position:relative;margin-top:14px}
.chart svg{display:block;width:100%;height:240px}
.chart .tip{position:absolute;top:0;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:500 12px var(--mono);box-shadow:var(--shadow);white-space:nowrap;transform:translateX(-50%)}
.range{display:grid;gap:6px}
.range .bar{position:relative;height:6px;background:var(--surface2);border-radius:3px}
.range .bar i{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.range .ends{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 20px}
.stat span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.stat b{font:600 15px var(--mono)}
.trade-bar{display:flex;gap:10px}
.trade-bar .btn{flex:1;padding:12px}

/* option chain */
.oc th,.oc td{padding:7px 10px;font-size:13px}
.oc td.k{font-weight:700;text-align:center;background:var(--surface2);font-family:var(--mono)}
.oc th.k{text-align:center}
.oc td.itm{background:var(--warn-soft)}
.oc .px-btn{border:1px solid transparent;background:none;border-radius:7px;padding:4px 7px;font:600 13px var(--mono)}
.oc .px-btn:hover{border-color:var(--accent);color:var(--accent)}
.oc tr.spot td{padding:0;border-bottom:2px solid var(--accent);height:0}
.oc .spot-tag{position:relative}
.oc .spot-tag span{position:absolute;left:50%;transform:translate(-50%,-50%);background:var(--accent);color:var(--accent-ink);font:600 11px var(--mono);padding:2px 8px;border-radius:999px}
.oi{font-size:12px;color:var(--muted)}

/* signal card */
.sig{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.sig.call{border-color:var(--up);background:linear-gradient(110deg,var(--up-soft),var(--surface) 55%)}
.sig.put{border-color:var(--down);background:linear-gradient(110deg,var(--down-soft),var(--surface) 55%)}
.sig .k{font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:700}
.sig .o{font:600 18px var(--mono)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.42);z-index:50;display:flex;justify-content:flex-end}
.sheet{width:min(440px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.sheet-h{padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-b{padding:16px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.sheet-f{padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.side-toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:10px;padding:3px}
.side-toggle button{border:0;background:none;padding:9px;border-radius:8px;font-weight:700;color:var(--muted)}
.side-toggle button.on.b{background:var(--up);color:#fff} .side-toggle button.on.s{background:var(--down);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font:600 15px var(--mono);outline:none;width:100%}
.field input:focus{border-color:var(--accent)}
.field input:disabled{background:var(--surface2);color:var(--muted)}
.stepper{display:flex;gap:6px}
.stepper button{width:42px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;font-weight:700}
.kv{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.kv b{font:600 13px var(--mono)}
.err{background:var(--down-soft);color:var(--down);border-radius:10px;padding:9px 12px;font-size:13px}
.info{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px}
.confirm{background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* price flashes (real changes only) */
.fl-up{animation:flu 1.3s ease-out}
.fl-dn{animation:fld 1.3s ease-out}
@keyframes flu{0%{background:var(--up-soft);color:var(--up);box-shadow:0 0 0 3px var(--up-soft)}100%{background:transparent;box-shadow:0 0 0 3px transparent}}
@keyframes fld{0%{background:var(--down-soft);color:var(--down);box-shadow:0 0 0 3px var(--down-soft)}100%{background:transparent;box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.fl-up,.fl-dn{animation:none}}
.ago{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.ago .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.ago.live .dot{background:var(--up);animation:pulse 1.6s infinite}
.ago.stale .dot{background:var(--warn)}

/* toasts */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--surface);border-radius:12px;padding:11px 14px;font-size:13.5px;box-shadow:var(--shadow);animation:in .2s ease-out}
.toast b{display:block}
@keyframes in{from{transform:translateY(8px);opacity:0}}

/* summary strip */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sum div{background:var(--surface);padding:14px 16px}
.sum span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.sum b{font:600 18px var(--mono)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));padding-top:14px}
  .side{display:none}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottom .nav-btn{flex-direction:column;gap:3px;font-size:11px;padding:6px 2px;justify-content:center;align-items:center}
  .bottom .nav-btn.on{background:none}
  .brand .word{display:none}
  .funds-pill span{display:none}
  .ago #agoTxt{display:none}
  .sheet{width:100%;height:auto;max-height:92%;margin-top:auto;border-radius:18px 18px 0 0}
  .scrim{align-items:flex-end}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .big{font-size:26px}
  .oc .c-chg{display:none}
  .oc th,.oc td{padding:7px 6px}
  .chart svg{height:200px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#163a70"/><path d="M7 21l6-6 4 3 8-9" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="word">Signal Desk</span><span class="paper" title="Virtual money – no real orders are placed">PAPER</span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search stocks, e.g. Reliance" autocomplete="off" aria-label="Search stocks">
      <div id="results" class="results" hidden></div>
    </div>
    <span class="ago" id="ago" title="When prices were last updated"><span class="dot"></span><span id="agoTxt">—</span></span>
    <button class="funds-pill" id="fundsPill" title="Available to trade"><span>Available</span><b id="availTop">—</b></button>
  </div>
  <div class="ticker" id="ticker"></div>
</header>

<div class="shell">
  <nav class="side" id="sideNav"></nav>
  <main id="view"></main>
</div>
<nav class="bottom" id="bottomNav"></nav>
<div id="sheetRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="engine.js"></script>
<script>
"use strict";
const E = window.PaperEngine;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (x, d = 2) => x == null || isNaN(x) ? "—" : Number(x).toLocaleString("en-IN", {minimumFractionDigits: d, maximumFractionDigits: d});
const rs = (x, d = 2) => x == null || isNaN(x) ? "—" : (x < 0 ? "−₹" : "₹") + fmt(Math.abs(x), d);
const sgn = (x, d = 2) => x == null || isNaN(x) ? "—" : (x > 0 ? "+" : x < 0 ? "−" : "") + fmt(Math.abs(x), d);
const cls = x => x > 0 ? "up" : x < 0 ? "down" : "muted";
const compact = x => x == null ? "—" : x >= 1e7 ? fmt(x / 1e7, 2) + " Cr" : x >= 1e5 ? fmt(x / 1e5, 2) + " L" : x >= 1e3 ? fmt(x / 1e3, 1) + " K" : fmt(x, 0);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const ICON = {
  explore: '<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
  watchlist: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  fno: '<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',
  orders: '<path d="M7 3h10a2 2 0 012 2v16l-3-2-2 2-2-2-2 2-2-2-3 2V5a2 2 0 012-2zM9 8h6M9 12h6"/>',
  portfolio: '<path d="M3 7h18v12a1 1 0 01-1 1H4a1 1 0 01-1-1zM8 7V5a2 2 0 012-2h4a2 2 0 012 2v2M3 12h18"/>',

function chartSVG(xs, ys, opts = {}) {
  if (!ys || ys.length < 2) return `<div class="empty"><b>No chart data yet</b>The line appears once trading starts.</div>`;

  const X = x => pad.l + (x - x0) / ((x1 - x0) || 1) * (W - pad.l - pad.r);
  const Y = y => pad.t + (hi - y) / (hi - lo) * (H - pad.t - pad.b);
  const up = ys[ys.length - 1] >= (ref != null ? ref : ys[0]);
  const col = up ? "var(--up)" : "var(--down)";
  const pts = xs.map((x, i) => `${X(x).toFixed(1)},${Y(ys[i]).toFixed(1)}`);
  const area = `M${pts[0]} L${pts.join(" L")} L${X(xs[xs.length - 1]).toFixed(1)},${H - pad.b} L${X(xs[0]).toFixed(1)},${H - pad.b} Z`;
  const gid = "g" + Math.random().toString(36).slice(2, 7);
  const refLine = ref != null ? `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="var(--faint)" stroke-dasharray="4 4" stroke-width="1"/>` : "";
  const labels = (opts.labels || []).map(([x, t]) => { const px = X(x), a = px < 40 ? "start" : px > W - 40 ? "end" : "middle";
    return `<text x="${px}" y="${H - 5}" font-size="11" fill="var(--faint)" text-anchor="${a}" font-family="var(--mono)">${t}</text>`; }).join("");
  const last = `<circle cx="${X(xs[xs.length - 1])}" cy="${Y(ys[ys.length - 1])}" r="3.5" fill="${col}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-x0="${x0}" data-x1="${x1}" data-w="${W}" data-pl="${pad.l}" data-pr="${pad.r}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${refLine}<path d="${area}" fill="url(#${gid})"/><polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${last}${labels}

    const r = svgEl.getBoundingClientRect();

const minToTime = m => { const t = 555 + m; return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };

  return `<div class="range"><div class="ends"><span>${l1} ${fmt(lo)}</span><span>${l2} ${fmt(hi)}</span></div><div class="bar"><i style="left:${p}%"></i></div></div>`;
}

function chainUnderlyings() {
  const keys = Object.keys((D.chains && D.chains.chains) || {});
  const u = [...new Set(keys.map(k => k.split("|")[0]))];
  const idx = ["NIFTY", "BANKNIFTY", "FINNIFTY", "MIDCPNIFTY"].filter(x => u.includes(x));
  return idx.concat(u.filter(x => !idx.includes(x)).sort());
}
function viewFno() {
  if (!D.chains) return `<h1>F&amp;O</h1><div class="card empty" style="margin-top:16px">Loading option chains…</div>`;
  const us = chainUnderlyings();
  if (!us.includes(fnoU)) fnoU = us[0];
  const exps = Object.keys(D.chains.chains).filter(k => k.startsWith(fnoU + "|")).map(k => k.split("|")[1]).sort();
  if (!fnoExp || !exps.includes(fnoExp)) fnoExp = exps[0];
  const ch = D.chains.chains[fnoU + "|" + fnoExp];
  const lot = E.lotSize({kind: "OPT", u: fnoU}, engineData());
  const spot = E.underlyingSpot(fnoU, engineData()) || ch.spot;
  const futs = Object.entries(D.quotes.futures || {}).filter(([k, f]) => f.u === fnoU);
  let spotDone = false;
  const rows = ch.rows.map(r => {
    const [K] = r; let pre = "";

    const ce = `OPT:${fnoU}:${fnoExp}:${K}:CE`, pe = `OPT:${fnoU}:${fnoExp}:${K}:PE`;
    const cIt = K < spot, pIt = K > spot;
    const pct = (l, c) => l != null && l - c ? (c / (l - c) * 100) : null;
    const cp = pct(r[1], r[2]), pp = pct(r[9], r[10]);
    return pre + `<tr>
      <td class="r ${cIt ? "itm" : ""}"><span class="oi">${compact(r[5])}</span></td>

      <td class="r ${cIt ? "itm" : ""}"><button class="px-btn${fx(ce)}" data-trade="${ce}" data-side="BUY" title="Trade ${fnoU} ${K} CE">${fmt(r[1])}</button></td>
      <td class="k">${K}</td>
      <td class="${pIt ? "itm" : ""}"><button class="px-btn${fx(pe)}" data-trade="${pe}" data-side="BUY" title="Trade ${fnoU} ${K} PE">${fmt(r[9])}</button></td>
      <td class="c-chg ${pIt ? "itm" : ""} num ${cls(pp)}" style="font-size:12px">${pp == null ? "" : sgn(pp, 1) + "%"}</td>
      <td class="${pIt ? "itm" : ""}"><span class="oi">${compact(r[13])}</span></td></tr>`;
  }).join("");
  const sel = `<select id="fnoU" style="border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:700">${us.map(u => `<option ${u === fnoU ? "selected" : ""}>${u}</option>`).join("")}</select>`;
  afterHooks.push(() => {
    const s = $("#fnoU"); if (s) s.onchange = e => go("fno-" + e.target.value);
    const view = fnoU + "|" + fnoExp;
    if (lastChainView !== view) { lastChainView = view; const r = $("#spotRow"); if (r) r.scrollIntoView({block: "center"}); }
  });
  return `
  <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px"><div><h1>F&amp;O</h1><div class="sub">Tap a price to buy or sell · lot size ${lot} · chain as of ${esc(D.chains.ts.slice(11, 16))} IST</div></div>${marketPill()}</div>
  ${signalCard() ? `<div style="margin-top:14px">${signalCard()}</div>` : ""}

    <div class="grow"></div><div class="num" style="font-weight:600">${fnoU} ${fmt(spot)}</div></div>
  <div class="card tbl-wrap"><table class="oc"><thead><tr><th class="r">Call OI</th><th class="r c-chg">Chg</th><th class="r">Call LTP</th><th class="k">Strike</th><th>Put LTP</th><th class="c-chg">Chg</th><th>Put OI</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="sub" style="margin-top:8px">Shaded cells are in the money. Orders fill at the live bid/ask when available.</div>
  ${futs.length ? `<h2>${fnoU} futures</h2><div class="card">${futs.map(([k, f]) => futRow(k, f)).join("")}</div>` : ""}`;

const statusPill = o => {
  const m = {COMPLETE: "up", REJECTED: "down", CANCELLED: "", OPEN: "acc", TRIGGER_PENDING: "warn"};
  const t = {TRIGGER_PENDING: "TRIGGER PENDING", OPEN: o.amo ? "AMO" : "OPEN"}[o.status] || o.status;
  return `<span class="pill ${m[o.status] || ""}">${t}</span>`;
};
const prodName = p => ({CNC: "Delivery", MIS: "Intraday", NRML: "Carry fwd"}[p] || p);
function orderRow(o, actions) {
  const px = o.fillPrice != null ? `@ ₹${fmt(o.fillPrice)}` : o.type === "MARKET" ? "Market" : o.type === "SL-M" ? `SL-M trig ₹${fmt(o.trigger)}` : o.type === "SL" ? `₹${fmt(o.price)} · trig ₹${fmt(o.trigger)}` : `Limit ₹${fmt(o.price)}`;
  return `<div class="list-item" style="align-items:flex-start"><div class="li-main">
    <b><span class="${o.side === "BUY" ? "up" : "down"}">${o.side}</span> ${esc(E.label(o.inst))}</b>
    <span>${o.qty} qty · ${prodName(o.product)} · ${esc(px)} · ${esc(o.ts.slice(11, 16))}${o.tag === "SQUAREOFF" ? " · auto" : ""}</span>
    ${o.msg && o.status !== "COMPLETE" || o.tag === "EXPIRY" || o.tag === "SQUAREOFF" ? `<span class="${o.status === "REJECTED" ? "down" : "muted"}" style="white-space:normal">${esc(o.msg || "")}</span>` : ""}</div>
    <div class="li-end" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">${statusPill(o)}
    ${actions && (o.status === "OPEN" || o.status === "TRIGGER_PENDING") ? `<div class="row" style="gap:6px"><button class="btn sm ghost" data-modify="${o.id}">Modify</button><button class="btn sm ghost" data-cancel="${o.id}">Cancel</button></div>` : ""}</div></div>`;
}
function viewOrders() {
  const today = E.ist(new Date()).date;

  const todays = acct.orders.filter(o => o.ts.slice(0, 10) === today && !(o.status === "OPEN" || o.status === "TRIGGER_PENDING"));
  const hist = acct.orders.filter(o => o.ts.slice(0, 10) !== today && !(o.status === "OPEN" || o.status === "TRIGGER_PENDING"));
  const lists = {open, today: todays, history: hist};

function positionRow(p) {
  const px = E.lastPrice(acct, p.inst, engineData());
  const pnl = p.qty ? (px - p.avg) * p.qty + p.realized : p.realized;
  const k = E.posKey(p.inst, p.product);
  const pct = p.qty && p.avg ? ((px - p.avg) / p.avg * 100 * Math.sign(p.qty)) : null;
  return `<div class="list-item" style="align-items:flex-start"><div class="li-main">
    <b>${esc(E.label(p.inst))} <span class="pill" style="margin-left:4px">${prodName(p.product)}</span></b>
    <span>${p.qty ? `${p.qty > 0 ? "+" : ""}${p.qty} qty · avg ₹${fmt(p.avg)} · LTP ₹${fmt(px)}` : `Closed · bought ${p.buyQty} · sold ${p.sellQty}`}</span></div>
    <div class="li-end" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><b class="${cls(pnl)}">${sgn(pnl)}</b>
    ${pct != null ? `<span class="${cls(pct)}">${sgn(pct)}%</span>` : ""}
    ${p.qty ? `<div class="row" style="gap:6px"><button class="btn sm ghost" data-trade="${esc(p.inst)}" data-side="${p.qty > 0 ? "BUY" : "SELL"}" data-product="${p.product}">Add</button><button class="btn sm ${p.qty > 0 ? "sell" : "buy"}" data-exit="${esc(k)}">Exit</button></div>` : ""}</div></div>`;
}

}

// ---------------------------------------------------------- auto-trader
function viewAuto() {
  const A = D.auto;
  if (!A) return `<div class="card empty"><b>Auto-trader starts with the next signal</b>Every market day it buys each NIFTY signal (1 lot) at the live price and sells it when the signal exits. Results appear here and in your emails.</div>`;
  const open = Object.values(A.open || {});
  let openVal = 0, openPnl = 0;
  const openRows = open.map(p => {
    const q = E.quote(p.key, engineData());
    const px = q ? E.execPrice(q, "SELL") : null;
    const pnl = px != null ? (px - p.buy_price) * p.qty : null;
    openVal += (px != null ? px : p.buy_price) * p.qty; if (pnl != null) openPnl += pnl;
    return `<div class="list-item"><div class="li-main"><b>${esc(p.option)} <span class="pill acc">OPEN</span></b>
      <span>${p.qty} qty · bought ₹${fmt(p.buy_price)} at ${esc(p.buy_time.slice(11, 16))} · now ${px != null ? "₹" + fmt(px) : "—"}${p.sl ? ` · SL ₹${fmt(p.sl)} · target ₹${fmt(p.target)}` : ""}</span></div>
      <div class="li-end"><b class="${cls(pnl)}">${pnl == null ? "—" : sgn(pnl)}</b><span class="muted">live</span></div></div>`;
  }).join("");
  const tr = (A.trades || []).slice().reverse();
  const net = tr.reduce((a, t) => a + t.net, 0);
  const wins = tr.filter(t => t.net > 0).length;
  const value = A.cash + openVal;
  const total = value - A.start_cash;
  const today = E.ist(new Date()).date;
  const todayNet = tr.filter(t => t.sell_time.slice(0, 10) === today).reduce((a, t) => a + t.net, 0);
  return `<div class="sum">
      <div><span>Account value</span><b>${rs(value)}</b></div>
      <div><span>Total P&amp;L since ${esc(A.started || "start")}</span><b class="${cls(total)}">${sgn(total)} <small style="font-size:12px">(${sgn(total / A.start_cash * 100)}%)</small></b></div>
      <div><span>Today</span><b class="${cls(todayNet + openPnl)}">${sgn(todayNet + openPnl)}</b></div>
      <div><span>Closed trades</span><b>${tr.length}</b></div>
      <div><span>Win rate</span><b>${tr.length ? fmt(wins / tr.length * 100, 0) + "%" : "—"}</b></div>
    </div>
    <div class="sub" style="margin-top:10px">Runs on its own every market day: buys each NIFTY signal (1 lot) at the live ask and sells at the live bid when the signal exits. Charges included. SENSEX signals are skipped because their option prices are only estimates. Updated ${esc((A.updated || "").slice(11, 16))} IST.</div>
    ${open.length ? `<h2>Open now</h2><div class="card">${openRows}</div>` : ""}
    <h2>Trade history</h2>
    <div class="card tbl-wrap">${tr.length ? `<table><thead><tr><th>Date</th><th>Option</th><th class="r">Qty</th><th class="r">Bought</th><th class="r">Sold</th><th class="r">Net P&amp;L</th><th>Why it closed</th></tr></thead><tbody>
      ${tr.slice(0, 200).map(t => `<tr><td class="num">${esc(t.buy_time.slice(5, 10))} ${esc(t.buy_time.slice(11, 16))}–${esc(t.sell_time.slice(11, 16))}</td><td><b>${esc(t.option)}</b></td><td class="r num">${t.qty}</td>
        <td class="r num">${fmt(t.buy_price)}</td><td class="r num">${fmt(t.sell_price)}</td><td class="r num ${cls(t.net)}">${sgn(t.net)}</td><td class="muted">${esc(t.reason || "")}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty"><b>No closed trades yet</b>The first one appears after the next signal exits.</div>`}</div>
    ${(A.skipped || []).length ? `<h2>Skipped signals</h2><div class="card">${A.skipped.slice(-10).reverse().map(x => `<div class="list-item"><div class="li-main"><b>${esc(x.option)}</b><span style="white-space:normal">${esc(x.time.slice(0, 16).replace("T", " "))} · ${esc(x.reason)}</span></div></div>`).join("")}</div>` : ""}`;

           qty: i.kind === "EQ" ? 1 : lot, price: q ? q.ltp : "", trigger: "", error: "", confirm: false, modifyId: null};
  if (modifyOrder) Object.assign(sheet, {side: modifyOrder.side, product: modifyOrder.product, type: modifyOrder.type, qty: modifyOrder.qty,
    price: modifyOrder.price || (q ? q.ltp : ""), trigger: modifyOrder.trigger || "", modifyId: modifyOrder.id});

}

function sheetInput(e) {
  if (!sheet) return;

function submitSheet() {
  const o = sheetOrder(); const d = engineData();
  if (sheet.modifyId) {
    const r = E.modifyOrder(acct, sheet.modifyId, {qty: o.qty, price: o.price, trigger: o.trigger, type: o.type}, d, new Date());

    save(); toast("Order updated", E.label(sheet.inst)); (r.events || []).forEach(toastEvent); closeSheet(); render(); return;
  }

  const filled = r.order.status === "COMPLETE";
  if (!filled) toast(r.order.amo ? "After-market order placed" : r.order.status === "TRIGGER_PENDING" ? "Stop-loss order placed" : "Order placed",
    `${o.side} ${o.qty} ${E.label(o.inst)} · ${r.order.amo ? "runs at next open" : "waiting to fill"}`);
  (r.events || []).forEach(toastEvent);
  closeSheet(); renderTop(); render();
}

// search
let sel = 0;
function searchResults(v) {
  v = v.trim().toLowerCase(); if (!v) return [];
  const syms = Object.keys(stocks());
  const score = s => { const n = nameOf(s).toLowerCase(), l = s.toLowerCase(); return l === v ? 0 : l.startsWith(v) ? 1 : n.startsWith(v) ? 2 : l.includes(v) ? 3 : n.includes(v) ? 4 : 9; };
  const idx = INDEX_ORDER.filter(k => INDEX_LABEL[k].toLowerCase().includes(v) || k.toLowerCase().includes(v)).map(k => ({k: "index-" + k, a: INDEX_LABEL[k], b: "Index", q: idxQuote(k)}));
  return idx.concat(syms.map(s => [s, score(s)]).filter(x => x[1] < 9).sort((a, b) => a[1] - b[1] || a[0].localeCompare(b[0])).slice(0, 12)
    .map(([s]) => ({k: "stock-" + s, a: s, b: nameOf(s), q: stocks()[s]})));
}
function paintResults() {
  const r = searchResults($("#q").value); const box = $("#results");
  if (!r.length) { box.hidden = !$("#q").value; box.innerHTML = `<div class="empty" style="padding:14px">No matches</div>`; if (!$("#q").value) box.hidden = true; return; }
  sel = Math.min(sel, r.length - 1);
  box.innerHTML = r.map((x, i) => { const c = chg(x.q || {}); return `<button data-go="${esc(x.k)}" class="${i === sel ? "sel" : ""}"><span><b>${esc(x.a)}</b><br><span class="muted" style="font-size:12px">${esc(x.b)}</span></span><span class="num" style="text-align:right">${x.q ? fmt(x.q.p) : ""}<br><span class="${cls(c.abs)}" style="font-size:12px">${x.q ? sgn(c.pct) + "%" : ""}</span></span></button>`; }).join("");
  box.hidden = false;
}
$("#q").addEventListener("input", () => { sel = 0; paintResults(); });
$("#q").addEventListener("focus", paintResults);
$("#q").addEventListener("keydown", e => {
  const r = searchResults($("#q").value);
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, r.length - 1); paintResults(); e.preventDefault(); }
  if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); paintResults(); e.preventDefault(); }
  if (e.key === "Enter" && r[sel]) { $("#results").hidden = true; $("#q").value = ""; $("#q").blur(); go(r[sel].k); }
  if (e.key === "Escape") { $("#results").hidden = true; $("#q").blur(); }
});

renderNav(); render(); renderTop();
(async () => { await Promise.all([loadQuotes(), loadSignals()]); if (route.name === "fno") ensureChains(true); if (route.name === "stock" || route.name === "index") ensureIntraday(); })();
function liveWindow() { const t = E.ist(new Date()); return t.wd >= 1 && t.wd <= 5 && t.mins >= 9 * 60 && t.mins <= 15 * 60 + 41; }
let lastPoll = 0;
setInterval(() => {
  if (document.hidden) return;
  const every = liveWindow() ? 5000 : 30000;
  if (Date.now() - lastPoll >= every) { lastPoll = Date.now(); loadQuotes(); loadSignals(); if (route.name === "stock" || route.name === "index") ensureIntraday(); }
}, 1000);
setInterval(() => { if (!document.hidden && D.quotes) tick(); }, 15000);
setInterval(() => {
  const el = $("#ago"); if (!el || !D.quotes) return;
  const age = Math.max(0, Math.round(E.feedAgeMs(engineData(), new Date()) / 1000));
  const open = E.marketOpen(engineData(), new Date());
  el.className = "ago " + (open && age < 60 ? "live" : open ? "stale" : "");
  $("#agoTxt").textContent = open ? (age < 60 ? `Live · ${age}s ago` : `Delayed · ${Math.round(age / 60)} min`) : `As of ${D.quotes.ts.slice(11, 16)}`;
}, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadQuotes(); });
</script>
</body>
